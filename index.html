const CloudSync = (function () {
  const CFG_KEY = 'cloud_cfg';
  const BACKUP_PATH = 'beikao/backup.json';
  const PROVIDERS = {
    github: { name: 'GitHub', api: 'https://api.github.com', auth: 'header', hub: 'github.com' },
    gitee:  { name: 'Gitee',  api: 'https://gitee.com/api/v5', auth: 'query',  hub: 'gitee.com' }
  };
  function getCfg() {
    return store.get(CFG_KEY, { provider: 'github', token: '', repo: '', branch: 'main', autoSync: false });
  }
  function setCfg(c) { store.set(CFG_KEY, c); }
  function b64encode(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64decode(b64) { return decodeURIComponent(escape(atob(b64))); }
  function ghHeaders(token) {
    return {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }
  async function request(method, path, body) {
    const cfg = getCfg();
    const prov = PROVIDERS[cfg.provider] || PROVIDERS.github;
    let url = prov.api + path;
    if (prov.auth === 'query' && cfg.token) url += (url.indexOf('?') >= 0 ? '&' : '?') + 'access_token=' + encodeURIComponent(cfg.token);
    const opts = {
      method,
      headers: prov.auth === 'header' ? ghHeaders(cfg.token) : { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    };
    let lastErr = null;
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        const res = await fetch(url, opts);
        if (!res.ok) {
          let raw = '';
          try { raw = await res.text(); } catch (e) {}
          let msg = res.status + ' ' + res.statusText;
          try { const j = JSON.parse(raw); if (j && j.message) msg = j.message; } catch (e) {}
          const err = new Error(msg);
          err.status = res.status;
          err.raw = raw;
          if (res.status === 401) err.message = (prov.name) + ' Token 无效或无权限，请确认令牌有仓库读写权限';
          else if (res.status === 404) err.message = '仓库不存在或无权访问，请检查 owner/repo 格式是否正确（如 用户名/仓库名）、仓库是否已创建、令牌是否有访问权' + (msg && msg !== '404 Not Found' ? '；接口返回：' + msg : '') + '；当前仓库：' + cfg.repo;
          else if (res.status === 400) err.message = '请求参数错误（400）' + (msg && msg !== '400 Bad Request' ? '：' + msg : '') + (raw ? '；原始返回：' + raw.slice(0, 200) : '') + '；当前仓库/分支：' + cfg.repo + '/' + cfg.branch;
          if (res.status >= 500 || res.status === 429) { lastErr = err; await new Promise(r => setTimeout(r, attempt * 800)); continue; }
          throw err;
        }
        if (res.status === 204) return null;
        return res.json();
      } catch (netErr) {
        lastErr = netErr;
        if (attempt < 3) { await new Promise(r => setTimeout(r, attempt * 1000)); continue; }
        break;
      }
    }
    throw lastErr || new Error('Failed to fetch');
  }
  async function getBranchSha(base, branch) {
    const r = await request('GET', base + '/branches/' + branch);
    return r.commit.sha;
  }
  function isEmptyRepo(err) {
    return err && (err.status === 409 || err.status === 404 || (err.message && err.message.indexOf('empty') >= 0));
  }
  function collectLocal() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(store.prefix) && k !== store.prefix + CFG_KEY) {
        data[k.slice(store.prefix.length)] = localStorage.getItem(k); // 原始字符串，无损
      }
    }
    return { app: 'gwy_workbench', version: 1, exportedAt: new Date().toISOString(), data };
  }
  // ===== Gitee 上传：用 contents 接口 + 本地计算 blob SHA（绕过 Gitee SHA bug）=====
  // Gitee GET /contents/{path} 返回的 sha 偶尔是 commit sha 而非 blob sha，
  // 导致 PUT 更新报 "Blob SHA does not match"。这里根据返回的 content 本地算出真正的 blob SHA 再更新。
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function gitBlobShaFromBase64(b64) {
    const crypto = window.crypto || self.crypto;
    if (!crypto || !crypto.subtle) throw new Error('当前环境不支持 SHA-1，请在 https 或 localhost 下使用');
    const bytes = b64ToBytes(b64);
    const te = new TextEncoder();
    const header = te.encode('blob ' + bytes.length + '\0');
    const buf = new Uint8Array(header.length + bytes.length);
    buf.set(header, 0);
    buf.set(bytes, header.length);
    const digest = await crypto.subtle.digest('SHA-1', buf);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function correctShaFromContent(ex, log) {
    if (!ex || !ex.content) return ex && ex.sha;
    try {
      const computed = await gitBlobShaFromBase64(ex.content);
      if (computed && computed !== ex.sha) {
        if (log) log('校正云端文件 SHA...');
        return computed;
      }
    } catch (e) {}
    return ex.sha;
  }
  async function uploadGitee(cfg, base, content, log) {
    const filePath = BACKUP_PATH;
    const getUrl = base + '/contents/' + filePath;
    let existingSha = null;
    try {
      const ex = await request('GET', getUrl + '?ref=' + encodeURIComponent(cfg.branch));
      existingSha = await correctShaFromContent(ex, log);
      log('检测到云端已有备份，准备更新...');
    } catch (e) {
      if (e && e.status !== 404) throw e; // 404=文件尚不存在，可创建
      log('云端无此备份，准备新建...');
    }
    log('提交到云端（约 ' + Math.round(content.length / 1024) + ' KB）...');
    const body = {
      content: content,
      message: 'beikao backup ' + new Date().toISOString(),
      branch: cfg.branch
    };
    if (existingSha) {
      // 文件已存在：Gitee 要求 PUT + sha
      body.sha = existingSha;
      await request('PUT', getUrl, body);
    } else {
      // 文件不存在：Gitee 要求 POST（无需 sha）
      try {
        await request('POST', getUrl, body);
      } catch (err) {
        const msg = ((err && err.message) || '').toLowerCase();
        // 若因并发/网络导致 GET 误判为不存在，POST 时提示已存在，则自动改为更新
        if (err.status === 400 || err.status === 422 || msg.indexOf('文件名已存在') >= 0 || msg.indexOf('already exists') >= 0 || msg.indexOf('exists') >= 0) {
          log('检测到文件实际已存在，改用更新模式...');
          const ex2 = await request('GET', getUrl + '?ref=' + encodeURIComponent(cfg.branch));
          body.sha = await correctShaFromContent(ex2, log);
          await request('PUT', getUrl, body);
        } else {
          throw err;
        }
      }
    }
    store.set('cloud_last_sync', new Date().toISOString());
    log('✅ 上传完成');
  }
  async function downloadGitee(cfg, base, log) {
    const getUrl = base + '/contents/' + BACKUP_PATH;
    let res;
    try {
      res = await request('GET', getUrl + '?ref=' + encodeURIComponent(cfg.branch));
    } catch (e) {
      if (e && e.status === 404) { log('云端还没有备份，请先在原设备「上传」'); return; }
      throw e;
    }
    const payload = JSON.parse(b64decode(res.content));
    const d = payload.data || {};
    window.__autoSyncSuppress = true;
    try {
      for (const k in d) localStorage.setItem(store.prefix + k, d[k]);
    } finally {
      window.__autoSyncSuppress = false;
    }
    store.set('cloud_last_sync', new Date().toISOString());
    log('✅ 下载完成，已写入本机');
    const cur = store.get('current_page', 'home');
    if (cur !== 'cloud' && pageRenderers[cur]) pageRenderers[cur]();
  }
  async function upload(log) {
    const cfg = getCfg();
    if (!cfg.token || !cfg.repo) throw new Error('请先在①填写 Token 和仓库');
    const prov = PROVIDERS[cfg.provider] || PROVIDERS.github;
    log('读取本地数据...');
    const payload = collectLocal();
    const content = b64encode(JSON.stringify(payload));
    const base = '/repos/' + cfg.repo;
    if (cfg.provider === 'gitee') {
      await uploadGitee(cfg, base, content, log);
      return;
    }
    // ===== GitHub：git-data 接口（原逻辑）=====
    log('上传到云端（约 ' + Math.round(content.length / 1024) + ' KB）...');
    log('创建数据对象...');
    const blob = await request('POST', base + '/git/blobs', { content, encoding: 'base64' });

      let branchSha = null;
      try {
        branchSha = await getBranchSha(base, cfg.branch);
      } catch (e) {
        if (isEmptyRepo(e)) {
          throw new Error(prov.name + ' 仓库分支为空，请先在 ' + prov.hub + '/' + cfg.repo + ' 创建一个文件（如 README）并提交，然后再点上传');
        }

      const baseTree = commit.tree.sha;
      log('创建文件树...');
      const tree = await request('POST', base + '/git/trees', {
        base_tree: baseTree,
        tree: [{ path: BACKUP_PATH, mode: '100644', type: 'blob', sha: blob.sha }]
      });
      log('创建提交...');
      const newCommit = await request('POST', base + '/git/commits', {
        message: 'beikao backup ' + payload.exportedAt,
        tree: tree.sha, parents: [branchSha]
      });

        await request('PATCH', base + '/git/refs/heads/' + cfg.branch, { sha: newCommit.sha });

        log('✅ 上传完成');
        return;
      } catch (err) {
        const msg = (err && err.message) || '';
        if (msg.toLowerCase().includes('fast forward') && attempt < 3) {
          log('⚠️ 云端分支有更新，正在自动合并重试（第' + (attempt + 1) + '次）...');
          continue;
        }
        throw err;
      }
    }
  }
  async function validate(log) {
    const cfg = getCfg();
    if (!cfg.token || !cfg.repo) throw new Error('请填写 Token 和仓库');
    const base = '/repos/' + cfg.repo;
    log('正在校验仓库...');
    const info = await request('GET', base);
    const defaultBranch = info.default_branch || (cfg.provider === 'gitee' ? 'master' : 'main');
    log('✅ 仓库可访问，默认分支：' + defaultBranch);

  async function download(log) {

    const prov = PROVIDERS[cfg.provider] || PROVIDERS.github;

    } finally {
      window.__autoSyncSuppress = false;
    }

    log('✅ 下载完成，已写入本机');
    const cur = store.get('current_page', 'home');
    if (cur !== 'cloud' && pageRenderers[cur]) pageRenderers[cur]();
  }

})();

/* 自动同步：监听数据变动，防抖后自动上传 */
let autoSyncTimer = null;
function scheduleAutoSync() {
  const cfg = CloudSync.getCfg();
  if (!cfg.autoSync || !cfg.token || !cfg.repo) return;
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(doAutoUpload, 3000);
}
async function doAutoUpload() {
  const page = document.getElementById('page-cloud');
  const logEl = page && page.querySelector('#cloud-log');
  const log = (m) => { if (logEl) { logEl.textContent += (logEl.textContent ? '\n' : '') + m; logEl.scrollTop = logEl.scrollHeight; } };
  try {
    if (logEl) log('自动同步中...');
    await CloudSync.upload(log);
    if (page) { const lt = page.querySelector('#cloud-last'); if (lt) lt.textContent = new Date().toLocaleString('zh-CN'); }
  } catch (err) {
    if (logEl) log('❌ 自动同步失败：' + (err.message || err));
  }
}
(function () {
  const _set = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function (k, v) {
    const r = _set(k, v);
    if (!window.__autoSyncSuppress && k.indexOf(store.prefix) === 0 && k !== store.prefix + 'cloud_cfg' && k !== store.prefix + 'cloud_last_sync') {
      scheduleAutoSync();
    }
    return r;
  };
})();

/* 云同步页面事件委托 */

    } else if (act === 'cloud-export') {

          const d = (payload && payload.data) || payload;
          window.__autoSyncSuppress = true;
          try {
            for (const k in d) localStorage.setItem(store.prefix + k, d[k]);
          } finally { window.__autoSyncSuppress = false; }
          store.set('cloud_last_sync', new Date().toISOString());
          log('✅ 已导入备份，' + Object.keys(d).length + ' 条数据已写入本机');
          const cur = store.get('current_page', 'home');
          if (cur !== 'cloud' && pageRenderers[cur]) pageRenderers[cur]();
        } catch (err) {
          log('❌ 导入失败：' + (err.message || err));
        }
      };
      inp.click();
    }
  } catch (err) {
    let m = err.message || err;
    if (err.raw) m += '\n原始返回：' + err.raw.slice(0, 300);
    log('❌ ' + m);
  } finally {
    if (act !== 'cloud-save-cfg') actEl.disabled = false;
  }
});

/* 自动同步开关状态变化 */
document.getElementById('page-cloud').addEventListener('change', (e) => {
  const el = e.target.closest('[data-act="cloud-auto"]');
  if (!el) return;
  const cfg = CloudSync.getCfg();
  cfg.autoSync = el.checked;
  CloudSync.setCfg(cfg);
  if (cfg.autoSync) doAutoUpload();
});

/* 初始化：恢复上次页面，默认首页总览 */
switchPage(store.get('current_page', 'home'));

/* 窗口大小变化时重绘首页图表，保证手机/平板切换时自适应 */
let __resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(__resizeTimer);
  __resizeTimer = setTimeout(() => {
    if (store.get('current_page', 'home') === 'home' && pageRenderers.home) pageRenderers.home();
  }, 200);
});

/* PWA：注册 Service Worker，使应用可离线、可“安装到主屏幕” */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
