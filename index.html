<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陈陈陈必上岸｜专属备考工作台</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E0301E">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="备考工作台">
<style>
/* ========== 全局规范 ========== */
:root {
  --theme: #FADCE4;           /* 浅粉主题色 */
  --theme-deep: #F5B8C9;      /* 深一档粉，用于强调 */
  --theme-light: #FDF0F4;     /* 更浅粉，用于hover */
  --bg: #FEFBFC;              /* 页面背景 */
  --card: #FFFFFF;            /* 卡片纯白 */
  --text: #4A4A4A;            /* 深灰正文 */
  --text-sub: #9B9B9B;        /* 次级文字 */
  --radius: 14px;             /* 全局圆角 */
  --shadow: 0 4px 16px rgba(190, 140, 160, 0.10);  /* 柔和轻阴影 */
  --shadow-sm: 0 2px 8px rgba(190, 140, 160, 0.08);
  --sidebar-w: 240px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  overflow: hidden;
}

/* ========== 整体布局：左侧固定240px + 右侧自适应 ========== */
.app {
  display: flex;
  height: 100vh;
  min-width: 900px; /* 平板横屏适配 */
}

/* ========== 左侧导航栏 ========== */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  height: 100vh;
  background: var(--card);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  z-index: 10;
}
.sidebar-title {
  padding: 26px 20px 20px;
  border-bottom: 1px solid #F7EBEF;
}
.sidebar-title h1 {
  font-size: 19px;
  font-weight: 700;
  color: #E8899E;
  letter-spacing: 1px;
}
.title-star {
  color: #E0301E;
  font-size: 18px;
  margin-right: 2px;
  vertical-align: 1px;
  text-shadow: 0 1px 1px rgba(224,48,30,.18);
}
.sidebar-title p {
  margin-top: 6px;
  font-size: 12.5px;
  color: var(--text-sub);
  letter-spacing: 2px;
}
.nav {
  flex: 1;
  overflow-y: auto;
  padding: 14px 12px;
}
.nav::-webkit-scrollbar { width: 4px; }
.nav::-webkit-scrollbar-thumb { background: var(--theme); border-radius: 4px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  margin-bottom: 6px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 15px;
  color: var(--text);
  transition: background .2s, color .2s;
  user-select: none;
}
.nav-item .icon { font-size: 17px; width: 22px; text-align: center; }
.nav-item:hover { background: var(--theme-light); }
.nav-item.active {
  background: var(--theme);      /* 选中项浅粉高亮 */
  color: #5A3A44;
  font-weight: 600;
}
.sidebar-footer {
  padding: 14px 20px;
  font-size: 11.5px;
  color: #C9B2BA;
  text-align: center;
  border-top: 1px solid #F7EBEF;
}

/* ========== 右侧内容主区域 ========== */
.main {
  flex: 1;
  height: 100vh;
  overflow-y: auto;
  padding: 28px 32px;
}
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-thumb { background: var(--theme); border-radius: 6px; }

.page { display: none; animation: fadeIn .25s ease; }
.page.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 页面头部 */
.page-header { margin-bottom: 22px; }
.page-header h2 {
  font-size: 22px;
  font-weight: 700;
  color: #4A4A4A;
  display: flex;
  align-items: center;
  gap: 10px;
}
.page-header h2::before {
  content: "";
  width: 5px;
  height: 22px;
  background: var(--theme-deep);
  border-radius: 3px;
  display: inline-block;
}
.page-header .desc {
  margin-top: 8px;
  font-size: 13px;
  color: var(--text-sub);
}

/* ========== 卡片 ========== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 24px;
  margin-bottom: 20px;
}

/* 空页面占位样式（后续逐页填充时替换） */
.placeholder {
  min-height: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  color: var(--text-sub);
}
.placeholder .ph-icon { font-size: 44px; opacity: .75; }
.placeholder .ph-text { font-size: 15px; }
.placeholder .ph-tip {
  font-size: 12.5px;
  color: #C9B2BA;
  background: var(--theme-light);
  padding: 6px 16px;
  border-radius: 999px;
}

/* ========== 统一按钮 ========== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 20px;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: opacity .2s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--theme); color: #5A3A44; font-weight: 600; }
.btn-primary:hover { background: var(--theme-deep); }
.btn-ghost {
  background: #fff;
  color: var(--text);
  border: 1px solid #F0DCE3;
}
.btn-ghost:hover { background: var(--theme-light); }

/* ========== 统一输入框 ========== */
.input, textarea.input, select.input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #F0DCE3;
  border-radius: var(--radius);
  font-size: 14px;
  color: var(--text);
  background: #fff;
  outline: none;
  font-family: inherit;
  transition: border .2s, box-shadow .2s;
}
.input:focus {
  border-color: var(--theme-deep);
  box-shadow: 0 0 0 3px rgba(250, 220, 228, .5);
}
textarea.input { resize: vertical; min-height: 80px; }

/* ========== 首页总览 ========== */
.banner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
  background: linear-gradient(120deg, #FDF0F4 0%, var(--theme) 100%);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 26px 28px;
  margin-bottom: 20px;
}
.banner h3 { font-size: 21px; color: #5A3A44; font-weight: 700; }
.banner .banner-date { margin-top: 8px; font-size: 13.5px; color: #A0788A; }
.pill-group { display: flex; gap: 14px; }
.pill {
  background: rgba(255, 255, 255, .85);
  border-radius: var(--radius);
  padding: 12px 22px;
  text-align: center;
  min-width: 92px;
  box-shadow: var(--shadow-sm);
}
.pill .num { font-size: 21px; font-weight: 700; color: #E8899E; }
.pill .lab { margin-top: 4px; font-size: 12px; color: var(--text-sub); }

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}
.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}
.grid-4 .mod-card { padding: 16px 16px; }
.grid-4 .mod-stat { padding: 7px 6px; }
.mod-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 18px 20px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.mod-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.mod-head { display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 600; }
.mod-practice-wrap { margin-top: 14px; }
.mod-practice {
  display: inline-block; font-size: 12.5px; font-weight: 600;
  padding: 6px 12px; border-radius: 999px;
  background: #F4F0F1; color: #A89AA0; border: 1px solid #ECE6E8;
}
.mod-practice.done {
  background: var(--theme); color: #B23A52; border-color: #F0C4D2;
  box-shadow: 0 1px 3px rgba(232,137,158,.25);
}

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.two-col .card { margin-bottom: 0; }
.section-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
.section-title small { font-size: 12px; color: var(--text-sub); font-weight: 400; }

.progress-outer { height: 12px; background: var(--theme-light); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
.progress-inner { height: 100%; background: linear-gradient(90deg, var(--theme), #F0A5BC); border-radius: 999px; transition: width .3s; }

.todo-list { max-height: 240px; overflow-y: auto; }
.todo-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; margin-bottom: 8px;
  background: #FDF8FA; border-radius: 10px;
  cursor: pointer; user-select: none;
}
.todo-item:hover { background: var(--theme-light); }
.todo-check {
  width: 20px; height: 20px; min-width: 20px;
  border: 2px solid var(--theme-deep); border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #fff; background: #fff;
}
.todo-item.done .todo-check { background: var(--theme-deep); }
.todo-item.done .todo-text { text-decoration: line-through; color: var(--text-sub); }
.todo-text { font-size: 14px; }
.empty-tip { text-align: center; color: var(--text-sub); font-size: 13px; padding: 40px 0; }

/* 每日计划页 */
.plan-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.plan-form .input { flex: 1; min-width: 160px; }
.plan-form select.input { flex: 0 0 160px; }
.plan-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.plan-task {
  display: flex; align-items: center; gap: 12px;
  background: #FDF8FA; border: 1.5px solid #F0DCE3; border-radius: var(--radius);
  padding: 11px 14px;
}
.plan-check {
  width: 24px; height: 24px; min-width: 24px; border-radius: 8px;
  border: 2px solid var(--theme-deep); background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: #fff; cursor: pointer;
}
.plan-task.done .plan-check { background: var(--theme-deep); }
.plan-text { flex: 1; font-size: 14px; line-height: 1.5; }
.plan-task.done .plan-text { text-decoration: line-through; color: var(--text-sub); }
.plan-tag {
  font-size: 12px; font-weight: 600; color: var(--theme-deep);
  background: var(--theme-light); border-radius: 999px; padding: 3px 11px; white-space: nowrap;
}
.plan-del {
  border: none; background: transparent; color: #E8899E; cursor: pointer;
  font-size: 14px; width: 28px; height: 28px; border-radius: 8px; line-height: 1;
}
.plan-del:hover { background: #fff; }

/* 课程表（周视图） */
.ct-scroll { overflow-x: auto; padding-bottom: 4px; }
.ct-grid { display: grid; grid-template-columns: 60px repeat(7, minmax(92px, 1fr)); gap: 6px; min-width: 720px; }
.ct-cell {
  background: #FDF8FA; border: 1px solid #F3E7EB; border-radius: 10px;
  padding: 6px 7px; min-height: 58px; font-size: 12.5px;
}
.ct-head {
  background: var(--theme-light); color: var(--theme-deep); font-weight: 700;
  text-align: center; min-height: auto; display: flex; align-items: center; justify-content: center;
}
.ct-label {
  background: var(--theme-light); color: var(--theme-deep); font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.ct-cell.ct-today { border-color: var(--theme-deep); box-shadow: 0 0 0 2px rgba(240,165,188,.5) inset; }
.ct-empty { color: #D9C3CC; text-align: center; font-size: 16px; line-height: 46px; }
.ct-pill {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  background: #fff; border: 1px solid #F0DCE3; color: #5A3A44;
  border-radius: 999px; padding: 3px 8px; margin: 2px; font-size: 12px; line-height: 1.4;
}
.ct-pill-x {
  border: none; background: transparent; color: #E8899E; cursor: pointer;
  font-size: 11px; line-height: 1; padding: 0 2px;
}
.ct-pill-x:hover { color: #C0506A; }
.ct-pill-edit {
  border: none; background: transparent; color: #8E7CC3; cursor: pointer;
  font-size: 11px; line-height: 1; padding: 0 2px;
}
.ct-pill-edit:hover { color: #6A5BAE; }

/* 首页紧凑版课程表（适配 50% 宽左栏） */
.ct-grid.home-ct { grid-template-columns: 38px repeat(7, minmax(0, 1fr)); min-width: 0; gap: 4px; }
.ct-grid.home-ct .ct-cell { min-height: 48px; padding: 4px 5px; font-size: 11.5px; }
.ct-grid.home-ct .ct-head { font-size: 11.5px; }
.ct-grid.home-ct .ct-pill { font-size: 10.5px; padding: 2px 6px; margin: 1px; }
.ct-grid.home-ct .ct-empty { font-size: 13px; line-height: 38px; }

.chart-box svg { width: 100%; height: auto; display: block; }

.quick-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.quick-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 18px 10px;
  background: var(--card);
  border: none; border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  font-size: 15px; font-weight: 600; color: #5A3A44;
  cursor: pointer; font-family: inherit;
  transition: transform .15s, background .15s;
}
.quick-btn:hover { background: var(--theme); transform: translateY(-2px); }
.quick-btn .q-icon { font-size: 20px; }

@media (max-width: 1180px) {
  .grid-3 { gap: 12px; }
  .grid-4 { gap: 12px; }
  .two-col { gap: 14px; }
}

/* ========== 资料分析页 ========== */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm);
  padding: 18px 20px; text-align: center;
}
.stat-card .s-num { font-size: 24px; font-weight: 700; color: #E8899E; }
.stat-card .s-lab { margin-top: 6px; font-size: 12.5px; color: var(--text-sub); }

.type-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }


/* 知识点编辑器（资料分析卡片详情） */
.note-add { display: flex; gap: 10px; margin-bottom: 16px; }
.note-add .input { flex: 1; }
.note-list { display: flex; flex-direction: column; gap: 12px; }
/* 时政：浏览 / 背诵 */
.shishi-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.shishi-updated { font-size: 12.5px; color: var(--text-sub); margin-left: auto; }
.shishi-add { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.shishi-add .input { flex: 1; min-width: 180px; }
.shishi-add textarea.input { flex-basis: 100%; min-width: 100%; line-height: 1.6; }
.shishi-add .btn { align-self: flex-end; }
.shishi-item {
  background: #FDF8FA; border: 1.5px solid #F0DCE3; border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 12px;
}
.shishi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.shishi-date { font-size: 13px; font-weight: 700; color: var(--theme-deep); }
.shishi-title { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.5; margin-bottom: 8px; }
.shishi-pts { margin: 0; padding-left: 20px; color: var(--text); font-size: 14px; line-height: 1.7; }
.shishi-pts li { margin-bottom: 2px; }
.note-item {
  display: flex; gap: 10px; align-items: flex-start;
  background: #FDF8FA; border: 1.5px solid #F0DCE3; border-radius: var(--radius);
  padding: 12px 14px;
}
.note-text {
  flex: 1; min-height: 52px; resize: vertical; line-height: 1.65; font-size: 14px;
  border-color: transparent; background: #fff;
}
.note-text:focus { border-color: var(--theme); }
.note-del {
  flex: none; border: none; background: none; color: #C9B2BA; cursor: pointer;
  font-size: 15px; padding: 4px 6px; border-radius: 8px;
}
.note-del:hover { background: #FBDCE6; color: #E8899E; }

/* 题型模块 / 错题本（已迁移为知识点编辑器，样式见上方 .note-*） */

@media (max-width: 1180px) {
  .stat-row, .type-row { gap: 12px; }
}

/* ========== 录题弹窗（全局通用） ========== */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(90, 58, 68, .35);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
.modal-mask.show { display: flex; }
.modal {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow);
  width: 680px; max-width: 96vw; max-height: 88vh;
  display: flex; flex-direction: column;
}
@media (max-width: 768px) {
  .modal-mask { padding: 12px; align-items: flex-end; }
  .modal { width: 100%; max-height: 92vh; border-radius: 16px 16px 0 0; }
  .modal-head { padding: 14px 16px; }
  .modal-body { padding: 16px; }
  .modal-foot { padding: 12px 16px; }
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 24px; border-bottom: 1px solid #F7EBEF;
}
.modal-head h3 { font-size: 17px; color: #5A3A44; }
.modal-close {
  border: none; background: var(--theme-light); color: #A0788A;
  width: 30px; height: 30px; border-radius: 10px; cursor: pointer; font-size: 15px;
}
.modal-close:hover { background: var(--theme); }
.modal-body { padding: 20px 24px; overflow-y: auto; }
.modal-body::-webkit-scrollbar { width: 5px; }
.modal-body::-webkit-scrollbar-thumb { background: var(--theme); border-radius: 5px; }
.modal-foot {
  padding: 14px 24px; border-top: 1px solid #F7EBEF;
  display: flex; justify-content: flex-end; gap: 12px;
}

/* ========== 图片放大查看器 ========== */
.zl-photo-viewer {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(20, 12, 16, .92);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; padding: 16px;
}
.zl-photo-viewer.show { display: flex; }
.zl-photo-viewer img {
  max-width: 100%; max-height: 82vh; display: block;
  border-radius: 8px; object-fit: contain;
}
.zl-photo-close {
  position: absolute; top: 14px; right: 14px;
  width: 44px; height: 44px; border-radius: 50%;
  border: none; background: rgba(255,255,255,.9); color: #5A3A44;
  font-size: 22px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 10px rgba(0,0,0,.3);
}
.zl-photo-tip {
  position: absolute; bottom: 18px; left: 0; right: 0;
  text-align: center; color: rgba(255,255,255,.8); font-size: 13px;
}
@media (max-width: 768px) {
  .zl-photo-viewer img { max-height: 72vh; }
  .zl-photo-close { top: 10px; right: 10px; width: 40px; height: 40px; }
}
.form-row label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* 资料分析：10 模块卡片网格（一行 3 个） */
.zl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 4px; }
.zl-card {
  background: var(--card); border-radius: var(--radius); padding: 20px 18px;
  box-shadow: var(--shadow); cursor: pointer; border: 1px solid transparent;
  display: flex; flex-direction: column; gap: 6px;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.zl-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--theme); }
.zl-card-icon { font-size: 30px; line-height: 1; }
.zl-card-name { font-size: 17px; font-weight: 700; color: var(--text); }
.zl-card-desc { font-size: 12.5px; color: var(--text-sub); line-height: 1.55; min-height: 40px; }
.zl-card-stat { margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--theme-deep); }
.zl-card-go { margin-top: 6px; font-size: 12.5px; font-weight: 600; color: var(--theme-deep); }

/* 资料分析：卡片详情子页（全页面，非弹窗） */
.zl-sub-head { display: flex; align-items: center; gap: 14px; }
.zl-back { flex: none; }
.zl-detail-photos { margin-top: 20px; }
.photo-toolbar { margin-bottom: 14px; }

<script>
/* ================================================================
   全局本地存储工具 —— 所有页面数据统一走 store，刷新不丢失
   ================================================================ */
const store = {
  prefix: 'gwy_workbench_',
  get(key, def = null) {
    try {
      const v = localStorage.getItem(this.prefix + key);
      return v === null ? def : JSON.parse(v);
    } catch (e) { return def; }
  },
  set(key, val) {
    localStorage.setItem(this.prefix + key, JSON.stringify(val));
  },
  remove(key) {
    localStorage.removeItem(this.prefix + key);
  }
};

/* ================================================================
   页面注册表 —— 12个页面（后续逐页填充 render 内容）
   ================================================================ */
const PAGES = [
  { id: 'home',      icon: '🏠', name: '首页总览',  desc: '备考全局概览与今日速览' },
  { id: 'ziliao',    icon: '📊', name: '资料分析',  desc: '资料分析速算与专项练习' },
  { id: 'yanyu',     icon: '💬', name: '言语理解',  desc: '言语理解与表达专项训练' },
  { id: 'panduan',   icon: '🧩', name: '判断推理',  desc: '逻辑·定义·类比·图推·四错题本' },
  { id: 'shuliang',  icon: '🔢', name: '数量关系',  desc: '倍数·方程·星期日期·工程·几何·经济·容斥·最值·数列·行程·排列组合·概率·年龄·溶液·计数·错题本' },
  { id: 'zhengzhi',  icon: '🚩', name: '政治理论',  desc: '总论 · 分论 · 马原 · 错题本' },
  { id: 'changshi',  icon: '📚', name: '常识',      desc: '文史 · 科技 · 经济 · 地理 · 法律 · 错题本' },
  { id: 'shenlun',   icon: '✍️', name: '申论',      desc: '申论写作素材与真题练习' },
  { id: 'shizheng',  icon: '📰', name: '时政',      desc: '时政热点自动更新 · 浏览背诵 · 错题本' },
  { id: 'plan',      icon: '📝', name: '每日计划',  desc: '今日学习任务清单与安排' },
  { id: 'calendar',  icon: '📅', name: '打卡日历',  desc: '每日学习打卡与连续记录' },
  { id: 'cloud',     icon: '☁️', name: '云同步',    desc: '错题与数据云端备份 · 换设备同步' },
];

/* ================================================================
   渲染左侧导航
   ================================================================ */
const navEl = document.getElementById('nav');
navEl.innerHTML = PAGES.map(p => `
  <div class="nav-item" data-page="${p.id}">
    <span class="icon">${p.icon}</span><span>${p.name}</span>
  </div>
`).join('');

/* ================================================================
   渲染12个页面框架（当前为空框架，后续逐页填充模块内容）
   ================================================================ */
const mainEl = document.getElementById('main');
mainEl.innerHTML = PAGES.map(p => `
  <section class="page" id="page-${p.id}">
    <div class="page-header">
      <h2>${p.icon} ${p.name}</h2>
      <div class="desc">${p.desc}</div>
    </div>
    <div class="card">
      <div class="placeholder">
        <div class="ph-icon">${p.icon}</div>
        <div class="ph-text">「${p.name}」页面框架已就绪</div>
        <div class="ph-tip">等待填充模块内容 · 数据将自动保存到本地</div>
      </div>
    </div>
  </section>
`).join('');

/* ================================================================
   通用工具 & 共享数据约定
   ----------------------------------------------------------------
   module_stats   : { 'YYYY-MM-DD': { 模块id: {done, correct} } }  各模块页写入
   plans          : { 'YYYY-MM-DD': [ {text, done} ] }             每日计划页共用
   checkin_days   : [ 'YYYY-MM-DD', ... ]                          打卡日历页共用
   study_duration : { 'YYYY-MM-DD': 分钟数 }                        时长统计页共用
   ================================================================ */
function todayStr(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function fmtDateCN(d = new Date()) {
  const week = ['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${week[d.getDay()]}`;
}
const pageRenderers = {};   // 各页面渲染函数注册表，切换页面时自动调用

/* ================================================================
   页面1：首页总览
   ================================================================ */
const HOME_MODULES = [
  { id: 'ziliao',   icon: '📊', name: '资料分析', sub: '增长率 · 比重 · 平均数 · 速算' },
  { id: 'yanyu',    icon: '💬', name: '言语理解', sub: '逻辑填空 · 片段阅读 · 语句表达' },
  { id: 'panduan',  icon: '🧩', name: '判断推理', sub: '逻辑 · 定义 · 类比 · 图推 · 四类错题本' },
  { id: 'shuliang', icon: '🔢', name: '数量关系', sub: '倍数 · 方程 · 星期日期 · 工程 · 几何 · 经济 · 容斥 · 最值 · 数列 · 行程 · 排列组合 · 概率 · 年龄 · 溶液 · 计数 · 错题本' },
  { id: 'zhengzhi', icon: '🚩', name: '政治理论', sub: '总论 · 分论 · 马原 · 错题本' },
  { id: 'changshi', icon: '📚', name: '常识', sub: '文史 · 科技 · 经济 · 地理 · 法律 · 错题本' },
  { id: 'shenlun',  icon: '✍️', name: '申论', sub: '概括题 · 对策题 · 分析题 · 公文 · 大作文' },
  { id: 'shizheng', icon: '📰', name: '时政', sub: '时政库 · 浏览背诵 · 错题本' },
];

document.getElementById('page-home').innerHTML = `

  <div class="banner">

    </div>
  </div>

  <!-- 2. 八大模块概览（按导航顺序排列） -->
  <div class="grid-4" id="home-modules"></div>

  <!-- 3. 双栏数据区 -->
  <div class="two-col">
    <div class="card">
      <div class="section-title">📝 今日计划完成情况 <small id="home-plan-ratio"></small></div>
      <div class="progress-outer"><div class="progress-inner" id="home-plan-bar" style="width:0%"></div></div>
      <div class="todo-list" id="home-plan-list"></div>
      <div class="section-title" style="margin-top:18px">🗓️ 本周课程表 <small>今日列高亮</small></div>
      <div class="ct-scroll"><div id="home-ct"></div></div>
    </div>
    <div class="card chart-box">
      <div class="section-title">⏱️ 近7日学习时长 <small>单位：小时</small></div>
      <div id="home-chart"></div>
    </div>
  </div>

  <!-- 4. 底部快捷入口栏 -->
  <div class="quick-bar">
    <button class="quick-btn" onclick="switchPage('ziliao')"><span class="q-icon">📖</span>开始学习</button>
    <button class="quick-btn" onclick="switchPage('plan')"><span class="q-icon">➕</span>添加计划</button>
  </div>
`;

function calcStreak() {
  const days = new Set(store.get('checkin_days', []));
  let streak = 0;
  const d = new Date();
  if (!days.has(todayStr(d))) d.setDate(d.getDate() - 1);  // 今天还没打卡则从昨天算
  while (days.has(todayStr(d))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}

/* 每日自动更新的激励短句（按当天在一年中的序号取，确保当天固定、隔天更换） */
const MOTIVATIONAL_QUOTES = [
  '陈陈陈加油，上岸可期 🌟',
  '今天的努力，是明天的录取通知书 📩',
  '把坚持变成习惯，把上岸变成必然 💪',
  '每一道题，都是离梦想更近的一步 👣',
  '不为难自己，但也不放过自己 🔥',
  '稳扎稳打，水到渠成 🌊',
  '你只管努力，剩下的交给时间 ⏳',
  '笔尖下藏着星辰大海 ✍️',
  '别人在刷手机，你在刷题库，差距就这么来的 📚',

  '状态不好也别停，慢一点也是在前进 🐢',

  '你比昨天的自己更强了一点 💡',
  '把错题本翻烂，把考场变主场 🏟️',
  '黎明前的黑暗最浓，熬过去就天亮 🌅',
  '相信自己，你就是下一个上岸的人 🎓',
  '别让今天的懒，变成明天的憾 😤',
  '量变到质变，只差你再坚持一下 ⚡',
  '计划落地，分数起飞 🚀',
  '心有猛虎，细嗅蔷薇 🐯',
  '越努力，越幸运 ✨',
  '你的名字，值得出现在录取名单上 📜',
  '与其仰望别人，不如成为别人仰望的人 👑',
  '今天的汗水，是考场的底气 💦',
  '每一步都算数，每一分都珍贵 💎',
  '屏蔽干扰，专注当下 🎯',
  '把焦虑写成计划，把计划变成行动 📝',
  '上岸的路，没有捷径只有坚持 🛤️',
];
function dailyQuote() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  return MOTIVATIONAL_QUOTES[dayOfYear % MOTIVATIONAL_QUOTES.length];
}

function renderHome() {
  const today = todayStr();
  document.getElementById('home-date').textContent = fmtDateCN();
  document.getElementById('home-quote').textContent = dailyQuote();

  /* --- 横幅数据胶囊（仅保留连续打卡） --- */
  document.getElementById('home-streak').textContent = calcStreak() + ' 天';

  /* --- 八大模块卡片：今日是否练习 --- */
  const stats = (store.get('module_stats', {})[today]) || {};
  const plansToday = (store.get('plans', {})[today]) || [];
  const practicedSet = {};
  plansToday.forEach(t => { if (t.done && t.mod) practicedSet[t.mod] = true; });
  document.getElementById('home-modules').innerHTML = HOME_MODULES.map(m => {
    const practiced = practicedSet[m.id] || (stats[m.id] && stats[m.id].done > 0);
    const badge = practiced
      ? '<span class="mod-practice done">✅ 今日已练习</span>'
      : '<span class="mod-practice">○ 今日未练习</span>';
    return `<div class="mod-card" onclick="switchPage('${m.id}')">
      <div class="mod-head"><span>${m.icon}</span>${m.name}</div>
      <div class="mod-practice-wrap">${badge}</div>
    </div>`;
  }).join('');

  /* --- 左栏：今日计划 --- */
  const plans = store.get('plans', {});
  const todayPlans = plans[today] || [];
  const finished = todayPlans.filter(t => t.done).length;
  const pct = todayPlans.length ? Math.round(finished / todayPlans.length * 100) : 0;
  document.getElementById('home-plan-bar').style.width = pct + '%';
  document.getElementById('home-plan-ratio').textContent =
    todayPlans.length ? `已完成 ${finished}/${todayPlans.length} · ${pct}%` : '暂无计划';
  document.getElementById('home-plan-list').innerHTML = todayPlans.length
    ? todayPlans.map((t, i) => `
        <div class="todo-item ${t.done ? 'done' : ''}" data-idx="${i}">
          <div class="todo-check">${t.done ? '✓' : ''}</div>
          <div class="todo-text">${t.text}</div>
          <span class="plan-tag">${escHtml(t.mod || '其他')}</span>
        </div>`).join('')
    : `<div class="empty-tip">今日还没有计划，点击下方「添加计划」去安排吧 🌱</div>`;

  /* --- 左栏：本周课程表（紧凑只读版，今日列高亮） --- */
  document.getElementById('home-ct').innerHTML = renderCourseTableHome();

  /* --- 右栏：近7日学习时长折线图（SVG） --- */
  const dur = store.get('study_duration', {});
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = todayStr(d);
    days.push({ label: `${d.getMonth()+1}/${d.getDate()}`, hours: Math.round((dur[key] || 0) / 60 * 10) / 10 });
  }
  const W = Math.min(460, document.getElementById('home-chart').clientWidth || 460);
  const H = 210, padL = 36, padR = 14, padT = 16, padB = 30;
  const maxH = Math.max(2, ...days.map(d => d.hours));
  const x = i => padL + i * (W - padL - padR) / 6;
  const y = v => padT + (H - padT - padB) * (1 - v / maxH);
  const pts = days.map((d, i) => `${x(i)},${y(d.hours)}`).join(' ');
  const grid = [0, .5, 1].map(r => {
    const v = Math.round(maxH * r * 10) / 10;
    return `<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="#F7EBEF" stroke-width="1"/>
            <text x="${padL-6}" y="${y(v)+4}" font-size="10" fill="#C9B2BA" text-anchor="end">${v}</text>`;
  }).join('');
  document.getElementById('home-chart').innerHTML = `
    <svg viewBox="0 0 ${W} ${H}">
      ${grid}
      <polyline points="${pts}" fill="none" stroke="#F0A5BC" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="${x(0)},${y(0)} ${pts} ${x(6)},${y(0)}" fill="#FADCE4" opacity="0.35"/>
      ${days.map((d, i) => `
        <circle cx="${x(i)}" cy="${y(d.hours)}" r="4" fill="#fff" stroke="#E8899E" stroke-width="2"/>
        <text x="${x(i)}" y="${y(d.hours)-9}" font-size="10.5" fill="#E8899E" text-anchor="middle">${d.hours || ''}</text>
        <text x="${x(i)}" y="${H-8}" font-size="10.5" fill="#9B9B9B" text-anchor="middle">${d.label}</text>
      `).join('')}
    </svg>`;
}

/* ================================================================
   每日计划页（添加表单 + 今日计划表 + 进度条）
   ================================================================ */
const PLAN_MODULES = ['资料分析','言语理解','判断推理','数量关系','政治理论','常识','申论','时政','其他'];
function planAdd() {
  const inp = document.getElementById('plan-input');
  const sel = document.getElementById('plan-mod');
  if (!inp) return;
  const v = inp.value.trim();
  if (!v) { alert('请填写计划内容'); return; }
  const mod = sel ? sel.value : '其他';
  const today = todayStr();
  const plans = store.get('plans', {});
  if (!plans[today]) plans[today] = [];
  plans[today].unshift({ text: v, done: false, mod: mod });
  store.set('plans', plans);
  renderPlan();
}
function renderPlan() {
  const page = document.getElementById('page-plan');
  if (!page) return;
  const today = todayStr();
  const plans = store.get('plans', {});
  const list = plans[today] || [];
  const finished = list.filter(t => t.done).length;
  const pct = list.length ? Math.round(finished / list.length * 100) : 0;
  const opts = PLAN_MODULES.map(m => '<option value="' + m + '">' + m + '</option>').join('');
  const tasks = list.length
    ? list.map((t, i) => `
        <div class="plan-task ${t.done ? 'done' : ''}" data-idx="${i}">
          <div class="plan-check" data-act="toggle">${t.done ? '✓' : ''}</div>
          <div class="plan-text">${escHtml(t.text)}</div>
          <span class="plan-tag">${escHtml(t.mod || '其他')}</span>
          <button class="plan-del" data-act="del" title="删除">✕</button>
        </div>`).join('')
    : '<div class="empty-tip">今日还没有计划，在上方添加你的第一条吧 🌱</div>';
  page.innerHTML =
    '<div class="page-header"><h2>📝 每日计划</h2><div class="desc">安排今日学习任务，完成后勾选打卡</div></div>'
    + '<div class="card">'
    + '<div class="plan-form">'
    + '<input class="input" id="plan-input" placeholder="填写今日计划内容…" onkeydown="if(event.key===\'Enter\')planAdd()">'
    + '<select class="input" id="plan-mod">' + opts + '</select>'
    + '<button class="btn btn-primary" onclick="planAdd()">添加计划</button>'
    + '</div></div>'
    + '<div class="card">'
    + '<div class="section-title">📊 今日计划完成情况 <small>' + (list.length ? ('已完成 ' + finished + '/' + list.length + ' · ' + pct + '%') : '暂无计划') + '</small></div>'
    + '<div class="progress-outer"><div class="progress-inner" style="width:' + pct + '%"></div></div>'
    + '<div class="plan-list">' + tasks + '</div>'
    + '</div>'
    + '<div class="card">'
    + '<div class="section-title">🗓️ 每周课程表 <small>点击格子可把内容填到对应日期·时段</small></div>'
    + courseFormHtml()
    + '<div class="ct-scroll">' + renderCourseTable() + '</div>'
    + '</div>';
}
/* 课程表：星期 / 时段定义 */
const COURSE_DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
const COURSE_SLOTS = ['上午','下午','晚上'];
function courseFormHtml() {
  const dayOpts = COURSE_DAYS.map((d, i) => '<option value="' + (i + 1) + '">' + courseDate(i + 1) + '</option>').join('');
  const slotOpts = COURSE_SLOTS.map(s => '<option value="' + s + '">' + s + '</option>').join('');
  let val = '';
  if (courseEdit) {
    const arr = (store.get('course_table', {})[courseEdit.day + '-' + courseEdit.slot]) || [];
    val = arr[courseEdit.idx] || '';
  }
  const btnLabel = courseEdit ? '保存修改' : '添加课程';
  const ph = courseEdit ? '修改该课程内容…' : '本周该时段的学习内容…';
  return '<div class="plan-form">'
    + '<select class="input" id="course-day">' + dayOpts + '</select>'
    + '<select class="input" id="course-slot">' + slotOpts + '</select>'
    + '<input class="input" id="course-text" value="' + escHtml(val) + '" placeholder="' + ph + '" onkeydown="if(event.key===\'Enter\')courseAdd()">'
    + '<button class="btn btn-primary" onclick="courseAdd()">' + btnLabel + '</button>'
    + (courseEdit ? '<button class="btn" onclick="courseEditCancel()">取消</button>' : '')
    + '</div>';
}
function getTodayCourseDay() {
  const j = new Date().getDay();   // 0=周日 … 6=周六
  return j === 0 ? 7 : j;          // 映射为 1=周一 … 7=周日
}
/* 返回本周第 dayIdx 天(1=周一…7=周日)的日期标签，如 "7/27" */
function courseDate(dayIdx) {
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (now.getDay() === 0 ? 6 : now.getDay() - 1));
  const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + dayIdx - 1);
  return (d.getMonth() + 1) + '/' + d.getDate();
}
let courseEdit = null;   // 正在修改的课程 {day, slot, idx}；null=新增模式
function courseEditCancel() { courseEdit = null; renderPlan(); }
function renderCourseTable() {
  const t = store.get('course_table', {});
  const todayDay = getTodayCourseDay();
  let html = '<div class="ct-cell ct-head"></div>'
    + COURSE_DAYS.map((d, di) => '<div class="ct-cell ct-head">' + courseDate(di + 1) + '</div>').join('');
  COURSE_SLOTS.forEach(slot => {
    html += '<div class="ct-cell ct-label">' + slot + '</div>';
    COURSE_DAYS.forEach((d, di) => {
      const dayIdx = di + 1;
      const arr = t[dayIdx + '-' + slot] || [];
      const cls = 'ct-cell' + (dayIdx === todayDay ? ' ct-today' : '');
      const inner = arr.length
        ? arr.map((x, i) =>
            '<span class="ct-pill">' + escHtml(x)
            + '<button class="ct-pill-edit" data-act="courseedit" data-day="' + dayIdx + '" data-slot="' + slot + '" data-idx="' + i + '" title="修改">✎</button>'
            + '<button class="ct-pill-x" data-act="coursedel" data-day="' + dayIdx + '" data-slot="' + slot + '" data-idx="' + i + '" title="删除">✕</button>'
            + '</span>'
          ).join('')
        : '<div class="ct-empty">＋</div>';
      html += '<div class="' + cls + '" data-day="' + dayIdx + '" data-slot="' + slot + '">' + inner + '</div>';
    });
  });
  return html;
}
/* 首页专用：紧凑只读版课程表（无删除按钮，今日列高亮），适配 50% 宽左栏 */
function renderCourseTableHome() {
  const t = store.get('course_table', {});
  const todayDay = getTodayCourseDay();
  let html = '<div class="ct-grid home-ct">'
    + '<div class="ct-cell ct-head"></div>'
    + COURSE_DAYS.map((d, di) => '<div class="ct-cell ct-head">' + courseDate(di + 1) + '</div>').join('');
  COURSE_SLOTS.forEach(slot => {
    html += '<div class="ct-cell ct-label">' + slot + '</div>';
    COURSE_DAYS.forEach((d, di) => {
      const dayIdx = di + 1;
      const arr = t[dayIdx + '-' + slot] || [];
      const cls = 'ct-cell' + (dayIdx === todayDay ? ' ct-today' : '');
      const inner = arr.length
        ? arr.map(x => '<span class="ct-pill">' + escHtml(x) + '</span>').join('')
        : '<div class="ct-empty">＋</div>';
      html += '<div class="' + cls + '">' + inner + '</div>';
    });
  });
  html += '</div>';

}
function courseAdd() {
  const daySel = document.getElementById('course-day');
  const slotSel = document.getElementById('course-slot');
  const inp = document.getElementById('course-text');
  if (!inp) return;
  const v = inp.value.trim();
  if (!v) { alert('请填写课程内容'); return; }
  const day = daySel ? daySel.value : '1';
  const slot = slotSel ? slotSel.value : '上午';
  const t = store.get('course_table', {});
  if (courseEdit) {
    const key = courseEdit.day + '-' + courseEdit.slot;
    const arr = t[key] || [];
    if (arr[courseEdit.idx] !== undefined) arr[courseEdit.idx] = v;
    t[key] = arr;
    courseEdit = null;
    store.set('course_table', t);
    renderPlan();
    return;
  }
  const key = day + '-' + slot;
  if (!t[key]) t[key] = [];
  t[key].push(v);
  store.set('course_table', t);
  inp.value = '';
  if (inp) inp.focus();
  renderPlan();
}
/* 事件委托：计划勾选 / 删除（容器重建后仍有效） */
document.getElementById('page-plan').addEventListener('click', e => {
  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const task = e.target.closest('.plan-task');
  if (!task) return;
  const idx = +task.dataset.idx;
  const today = todayStr();
  const plans = store.get('plans', {});
  const list = plans[today] || [];
  const act = actEl.dataset.act;
  if (act === 'toggle' && list[idx]) { list[idx].done = !list[idx].done; plans[today] = list; store.set('plans', plans); renderPlan(); }
  else if (act === 'del') { list.splice(idx, 1); plans[today] = list; store.set('plans', plans); renderPlan(); }
});

/* 课程表：点击格子填入星期/时段、修改/删除单条课程（事件委托，容器重建后仍有效）
   注意：删除/修改按钮在 .ct-cell 内部，必须先于 cell 分支判断，否则会被 cell 分支吞掉 */
document.getElementById('page-plan').addEventListener('click', e => {
  const cd = e.target.closest('[data-act="coursedel"]');
  if (cd) {
    const t = store.get('course_table', {});
    const key = cd.dataset.day + '-' + cd.dataset.slot;
    const arr = t[key] || [];
    arr.splice(+cd.dataset.idx, 1);
    if (arr.length) t[key] = arr; else delete t[key];
    store.set('course_table', t);
    renderPlan();
    return;
  }
  const ce = e.target.closest('[data-act="courseedit"]');
  if (ce) {
    courseEdit = { day: ce.dataset.day, slot: ce.dataset.slot, idx: +ce.dataset.idx };
    renderPlan();
    const txt = document.getElementById('course-text');
    if (txt) txt.focus();
    return;
  }
  const cell = e.target.closest('.ct-cell[data-day]');
  if (cell) {
    courseEdit = null;          // 点格子切换上下文，退出修改模式
    renderPlan();
    const daySel = document.getElementById('course-day');
    const slotSel = document.getElementById('course-slot');
    const txt = document.getElementById('course-text');
    if (daySel) daySel.value = cell.dataset.day;
    if (slotSel) slotSel.value = cell.dataset.slot;
    if (txt) txt.focus();
    return;
  }
});
pageRenderers.plan = renderPlan;

/* ================================================================
   打卡日历页（月视图 + 月度统计 + 打卡时长设置）
   ----------------------------------------------------------------
   数据：checkin_days（已打卡日期集合）、study_duration（每日分钟数）
   与首页连续打卡、时长统计、7日折线图共用同一份数据
   ================================================================ */
let calViewY = new Date().getFullYear();
let calViewM = new Date().getMonth();   // 0 基
let calSel = todayStr();                // 当前选中的日期
let calPick = 1;                        // 选中日期当前选择的学习时长（小时）
const CAL_HOURS = [1, 2, 3, 4, 5];

function fmtHours(mins) {
  const h = Math.round(mins / 6) / 10;  // 分钟 → 0.1h，规避浮点误差
  return (Number.isInteger(h) ? h.toFixed(0) : h.toFixed(1)) + 'h';
}
function calStatCard(num, lab) {
  return '<div class="stat-card"><div class="num">' + num + '</div><div class="lab">' + lab + '</div></div>';
}
function renderCal() {
  const page = document.getElementById('page-calendar');
  if (!page) return;
  const checkin = new Set(store.get('checkin_days', []));
  const dur = store.get('study_duration', {});
  const y = calViewY, m = calViewM;
  const monthStr = y + '-' + String(m + 1).padStart(2, '0');
  const firstWeekday = new Date(y, m, 1).getDay();        // 0 = 周日
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = todayStr();

  /* --- 1. 月视图日历 --- */
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  let html =
    '<div class="page-header"><h2>📅 打卡日历</h2><div class="desc">点击日期选择打卡，记录每日学习时长，养成连续打卡好习惯</div></div>'
    + '<div class="card">'
    + '<div class="cal-head">'
    +   '<button class="cal-nav" data-cal="prev" title="上一月">‹</button>'
    +   '<div class="cal-month">' + y + ' 年 ' + (m + 1) + ' 月</div>'
    +   '<button class="cal-nav" data-cal="next" title="下一月">›</button>'
    + '</div>'
    + '<div class="cal-grid">'
    + WEEK.map(w => '<div class="cal-week">' + w + '</div>').join('');
  for (let i = 0; i < firstWeekday; i++) html += '<div class="cal-cell blank"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = monthStr + '-' + String(d).padStart(2, '0');
    const isChecked = checkin.has(ds);
    const isToday = ds === today;
    const isSel = ds === calSel;
    const cls = 'cal-cell'
      + (isChecked ? ' checked' : '')
      + (isToday ? ' today' : '')
      + (isSel ? ' selected' : '');
    const durLabel = isChecked && dur[ds] ? fmtHours(dur[ds]) : '';
    html += '<div class="' + cls + '" data-date="' + ds + '">'
      + '<div class="d">' + d + '</div>'
      + (durLabel ? '<div class="dur">' + durLabel + '</div>' : '<div class="cal-empty"></div>')
      + '</div>';
  }
  const trailing = (7 - ((firstWeekday + daysInMonth) % 7)) % 7;
  for (let i = 0; i < trailing; i++) html += '<div class="cal-cell blank"></div>';
  html += '</div></div>';

  /* --- 2. 月度统计（一行 3 个） --- */
  let monthDays = 0, monthMins = 0;
  checkin.forEach(ds => { if (ds.indexOf(monthStr + '-') === 0) { monthDays++; monthMins += (dur[ds] || 0); } });
  const monthHours = Math.round(monthMins / 60 * 10) / 10;
  html += '<div class="stat-row">'
    + calStatCard(monthDays + ' 天', '本月打卡天数')
    + calStatCard(monthHours + ' h', '本月总学习时长')
    + calStatCard(calcStreak() + ' 天', '连续打卡天数')
    + '</div>';

  /* --- 3. 打卡时长设置 --- */
  const selChecked = checkin.has(calSel);
  const selDur = selChecked ? dur[calSel] : null;
  const optsHtml = CAL_HOURS.map(h => {
    const active = Math.abs(calPick - h) < 0.001 ? ' active' : '';
    return '<div class="dur-opt' + active + '" data-hours="' + h + '">' + h + 'h</div>';
  }).join('');
  html += '<div class="card">'
    + '<div class="section-title">🕐 打卡时长设置</div>'
    + '<div class="dur-tip">点击日历日期选择打卡，选择当日学习时长'
    + ' · 已选 <b>' + calSel + '</b>'
    + (selChecked ? '（当前已打卡 ' + fmtHours(selDur) + '，本次再 +' + calPick + 'h）' : '（尚未打卡，本次 +' + calPick + 'h）')
    + '</div>'
    + '<div class="dur-opts">' + optsHtml + '</div>'
    + '<div class="dur-actions">'
    +   '<button class="btn btn-primary" onclick="calConfirm()">✓ 确认打卡</button>'
    +   '<button class="btn btn-ghost" onclick="calCancel()"'
    +     (selChecked ? '' : ' disabled style="opacity:.5;cursor:not-allowed"')
    +   '>✕ 取消当日打卡</button>'
    + '</div>'
    + '</div>';

  page.innerHTML = html;
}
/* 事件委托：月份切换 / 选时长 / 选中日期（容器重建后仍有效） */
document.getElementById('page-calendar').addEventListener('click', e => {
  const nav = e.target.closest('[data-cal]');
  if (nav) {
    if (nav.dataset.cal === 'prev') { calViewM--; if (calViewM < 0) { calViewM = 11; calViewY--; } }
    else { calViewM++; if (calViewM > 11) { calViewM = 0; calViewY++; } }
    renderCal();
    return;
  }
  const opt = e.target.closest('[data-hours]');
  if (opt) { calPick = parseFloat(opt.dataset.hours); renderCal(); return; }
  const cell = e.target.closest('.cal-cell[data-date]');
  if (cell) {
    calSel = cell.dataset.date;
    calPick = 1;   // 打卡为叠加模式：选中日期后默认本次增加 1h，可在右侧重新选择
    renderCal();
  }
});
function calConfirm() {
  const ds = calSel;
  const mins = Math.round(calPick * 60);
  const checkin = new Set(store.get('checkin_days', []));
  checkin.add(ds);
  store.set('checkin_days', [...checkin]);
  const dur = store.get('study_duration', {});
  dur[ds] = (dur[ds] || 0) + mins;   // 叠加：重复打卡累加当日时长，不覆盖
  store.set('study_duration', dur);
  if (pageRenderers.home) pageRenderers.home();   // 同步刷新首页连续打卡计数
  renderCal();
}
function calCancel() {
  const ds = calSel;
  const checkin = new Set(store.get('checkin_days', []));
  checkin.delete(ds);
  store.set('checkin_days', [...checkin]);
  const dur = store.get('study_duration', {});
  delete dur[ds];
  store.set('study_duration', dur);
  if (pageRenderers.home) pageRenderers.home();   // 同步刷新首页连续打卡计数
  renderCal();
}
pageRenderers.calendar = renderCal;

/* ================================================================
   共享工具：写入模块做题统计（供各刷题页调用，首页自动联动）
   ================================================================ */
function addModuleStat(modId, isCorrect) {
  const all = store.get('module_stats', {});
  const today = todayStr();
  if (!all[today]) all[today] = {};
  if (!all[today][modId]) all[today][modId] = { done: 0, correct: 0 };
  all[today][modId].done++;
  if (isCorrect) all[today][modId].correct++;
  store.set('module_stats', all);
}
function getModuleTotal(modId) {
  const all = store.get('module_stats', {});
  let total = 0;
  Object.values(all).forEach(day => { total += (day[modId]?.done || 0); });
  return total;
}

  { key: 'rate',      icon: '📈', name: 'R 增长率',   desc: 'r=(现期−基期)/基期；间隔/混合/年均增长率' },
  { key: 'zengliang', icon: '➕',  name: 'X 增长量',   desc: '增长量 = 现期×r/(1+r)，百化分速算、增长量比较' },
  { key: 'bizhong',   icon: '⚖️', name: '比重类',     desc: '比重 = 部分/整体；比重差、比重变化量' },

];

/* 速算技巧初始示例知识点（仅首次写入本地，之后由用户自由增删改） */
const ZL_SEED = {
  tip: [
    '截位直除：选项差距大截分母2位，差距小截3位；只截分母、四舍五入。',
    '分数比较：直除首位 / 竖直比较（分子大分母小则大）/ 差分法。',
    '增长量速算：百化分，增长量 ≈ 现期 ÷(n+1)；常用 50%=1/2、25%=1/4、20%=1/5。',
    '增长率公式：间隔 r=r₁+r₂+r₁r₂；混合偏向基数大的一方；年均 (1+r)ⁿ=现期÷基期。',
  ],
};

/* 本地存储：各卡片知识点 { key: [text, ...] } */
function zlNotesInit() {
  if (store.get('zl_notes', null) === null) {
    const d = {};
    ZL_CARDS.forEach(c => { d[c.key] = (ZL_SEED[c.key] || []).slice(); });
    store.set('zl_notes', d);
  }
}
function zlGetNotes(key) { return (store.get('zl_notes', {})[key] || []); }
function zlSaveNotes(key, arr) { const all = store.get('zl_notes', {}); all[key] = arr; store.set('zl_notes', all); }
function zlAddNote(key, text) { const arr = zlGetNotes(key); arr.push(text.trim()); zlSaveNotes(key, arr); }
function zlDelNote(key, idx) {
  const arr = zlGetNotes(key);
  arr.splice(idx, 1);
  zlSaveNotes(key, arr);
  renderZiliao();   // 重渲染当前详情子页
}
function zlEditNote(key, idx, val) {
  const arr = zlGetNotes(key);
  if (arr[idx] === undefined) return;
  arr[idx] = val;
  zlSaveNotes(key, arr);
}
function zlAddFromInput(key) {
  const inp = document.getElementById('zl-note-input');
  if (!inp) return;
  const v = inp.value.trim();
  if (!v) return;
  zlAddNote(key, v);
  renderZiliao();   // 重渲染当前详情子页，显示新知识点
}

/* 页面渲染：卡片网格 / 卡片详情子页（点击卡片进入全页面，非弹窗） */
let zlSub = null;   // null = 卡片网格视图，否则 = 当前卡片 key（子视图）
function renderZiliao() {
  zlNotesInit();
  if (zlSub) { renderZlSub(zlSub); }
  else { renderZlGrid(); }
}
pageRenderers.ziliao = renderZiliao;

function renderZlGrid() {
  let grid = document.getElementById('zl-grid');
  if (!grid) {
    /* 从子视图返回时 page-ziliao 已被整体替换，重建网格容器 */
    document.getElementById('page-ziliao').innerHTML =
      '<div class="page-header">'
      + '<h2>📊 资料分析</h2>'
      + '<div class="desc">知识点卡片 · 点击卡片进入撰写与增删</div>'
      + '</div>'
      + '<div class="zl-grid" id="zl-grid"></div>';
    grid = document.getElementById('zl-grid');
  }
  grid.innerHTML = ZL_CARDS.map(c => {
    const n = zlGetNotes(c.key).length;
    return '<div class="zl-card" data-key="' + c.key + '">'
      + '<div class="zl-card-icon">' + c.icon + '</div>'
      + '<div class="zl-card-name">' + c.name + '</div>'
      + '<div class="zl-card-desc">' + c.desc + '</div>'
      + '<div class="zl-card-stat">📝 ' + n + ' 条知识点</div>'
      + '<div class="zl-card-go">查看 / 编辑 →</div>'
      + '</div>';
  }).join('');
}

/* 卡片详情子页：知识点撰写 / 增删（全页面渲染，非弹窗） */
function renderZlSub(key) {
  const card = ZL_CARDS.find(c => c.key === key);
  if (!card) { zlSub = null; renderZlGrid(); return; }

  const notes = zlGetNotes(key);
  const listHtml = notes.length
    ? notes.map((t, i) =>
        '<div class="note-item">'
        + '<textarea class="input note-text" data-idx="' + i + '" oninput="zlEditNote(\'' + key + '\',' + i + ',this.value)">' + escHtml(t) + '</textarea>'
        + '<button class="note-del" title="删除" onclick="zlDelNote(\'' + key + '\',' + i + ')">✕</button>'
        + '</div>'
      ).join('')
    : '<div class="empty-tip">还没有知识点，在上方输入框添加你的笔记吧 ✍️</div>';

  /* 仅错题本显示拍照区（含分组管理） */
  let photoSection = '';
  if (key === 'wrong') {
    const pd = zlGetPhotoData();
    const groupOpts = pd.groups.map(g =>
      '<option value="' + g.id + '"' + (g.id === pd.active ? ' selected' : '') + '>' + escHtml(g.name) + '</option>'
    ).join('');
    const groupsHtml = pd.groups.map(g => {
      const gps = pd.photos.filter(p => p.group === g.id);
      const phtml = gps.length
        ? gps.map(p => {
            const moveOpts = pd.groups.map(gg =>
              '<option value="' + gg.id + '"' + (gg.id === p.group ? ' selected' : '') + '>' + escHtml(gg.name) + '</option>'
            ).join('');
            return '<div class="photo-item">'
              + '<img src="' + p.data + '" alt="错题照片" onclick="zlZoomPhoto(\'' + p.id + '\')">'
              + '<button class="photo-del" title="删除" onclick="zlDelPhoto(\'' + g.id + '\',\'' + p.id + '\')">✕</button>'
              + '<select class="photo-move" title="移动到分组" onchange="zlMovePhoto(\'' + p.id + '\',this.value)">' + moveOpts + '</select>'
              + '</div>';
          }).join('')
        : '<div class="photo-empty">本分组暂无照片</div>';
      return '<div class="photo-group">'
        + '<div class="photo-group-head"><span class="photo-group-name">📂 ' + escHtml(g.name) + '（' + gps.length + '）</span></div>'
        + '<div class="photo-grid">' + phtml + '</div>'
        + '</div>';
    }).join('');
    photoSection =
      '<div class="card zl-detail-photos">'
      + '<div class="section-title">📷 错题照片 · 分组管理</div>'
      + '<div class="photo-toolbar">'
      + '<select class="input photo-group-sel" title="选择当前分组（新拍照片归入此处）" onchange="zlSetGroup(this.value)">' + groupOpts + '</select>'
      + '<button class="btn" onclick="zlAddGroup()">＋ 新建分组</button>'
      + '<button class="btn btn-ghost" onclick="zlDelGroup(\'' + pd.active + '\')">🗑 删除当前分组</button>'
      + '<button class="btn btn-primary" onclick="document.getElementById(\'zl-photo-input\').click()">📷 拍摄错题</button>'
      + '<input type="file" id="zl-photo-input" accept="image/*" capture="environment" style="display:none" onchange="zlHandlePhoto(this)">'
      + '</div>'
      + '<div class="photo-groups">' + groupsHtml + '</div>'
      + '</div>';
  }

  document.getElementById('page-ziliao').innerHTML =
    '<div class="page-header zl-sub-head">'
    + '<button class="btn btn-ghost zl-back" onclick="zlBackToGrid()">← 返回</button>'
    + '<div><h2>' + card.icon + ' ' + card.name + '</h2>'
    + '<div class="desc">' + card.desc + '</div></div>'
    + '</div>'
    + '<div class="card">'
    + '<div class="section-title">📝 知识点笔记</div>'
    + '<div class="note-add">'
    + '<input class="input" id="zl-note-input" placeholder="输入一条知识点，回车或点添加…" onkeydown="if(event.key===\'Enter\')zlAddFromInput(\'' + key + '\')">'
    + '<button class="btn btn-primary" onclick="zlAddFromInput(\'' + key + '\')">＋ 添加</button>'
    + '</div>'
    + '<div class="note-list">' + listHtml + '</div>'
    + '</div>'
    + photoSection;

  const inp = document.getElementById('zl-note-input');
  if (inp) inp.focus();
}

function zlOpenSub(key) { zlSub = key; renderZiliao(); }
function zlBackToGrid() { zlSub = null; renderZiliao(); }

/* 错题本：拍照并压缩存储（控制体积，避免 localStorage 超限），按分组管理 */
function zlGetPhotoData() {
  let d = store.get('zl_wrong_photos', null);
  if (d === null) {
    d = { groups: [{ id: 'g0', name: '默认分组' }], photos: [], active: 'g0' };
  } else if (Array.isArray(d)) {
    // 旧版扁平 dataUrl 数组 → 迁移为分组结构
    d = {
      groups: [{ id: 'g0', name: '默认分组' }],
      photos: d.map((u, i) => ({ id: 'p' + Date.now() + '_' + i, data: u, group: 'g0' })),
      active: 'g0'
    };
  }
  return d;
}
function zlSavePhotoData(d) { store.set('zl_wrong_photos', d); }
function zlHandlePhoto(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // 先打开照片编辑器，编辑完成后再写入错题本
      PhotoEditor.open(reader.result, (edited) => {
        const pd = zlGetPhotoData();
        pd.photos.push({ id: 'p' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), data: edited, group: pd.active });
        zlSavePhotoData(pd);
        renderZiliao();   // 重渲染错题本详情，显示新照片
      });
      input.value = '';
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function zlDelPhoto(gid, pid) {
  const pd = zlGetPhotoData();
  pd.photos = pd.photos.filter(p => p.id !== pid);
  zlSavePhotoData(pd);
  renderZiliao();
}
function zlZoomPhoto(pid) {
  const pd = zlGetPhotoData();
  const p = pd.photos.find(x => x.id === pid);
  if (!p) return;
  zlOpenPhotoViewer(p.data);
}
function zlOpenPhotoViewer(src) {
  const v = document.getElementById('zlPhotoViewer');
  document.getElementById('zlPhotoViewerImg').src = src;
  v.classList.add('show');
  if (window.AppBridge && AppBridge.setPhotoViewerOpen) AppBridge.setPhotoViewerOpen(true);
}
function zlClosePhotoViewer() {
  const v = document.getElementById('zlPhotoViewer');
  v.classList.remove('show');
  document.getElementById('zlPhotoViewerImg').src = '';
  if (window.AppBridge && AppBridge.setPhotoViewerOpen) AppBridge.setPhotoViewerOpen(false);
}
function zlPhotoViewerOpen() { return document.getElementById('zlPhotoViewer').classList.contains('show'); }
(function () {
  const v = document.getElementById('zlPhotoViewer');
  v.addEventListener('click', function (e) { if (e.target === v || e.target.id === 'zlPhotoViewerImg') zlClosePhotoViewer(); });
})();

function toggleMobileSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarMask').classList.toggle('show');
}
function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarMask').classList.remove('show');
}
function zlSetGroup(gid) {
  const pd = zlGetPhotoData();
  if (pd.groups.some(g => g.id === gid)) { pd.active = gid; zlSavePhotoData(pd); renderZiliao(); }
}
function zlAddGroup() {
  const name = (window.prompt('请输入新分组名称', '新分组') || '').trim();
  if (!name) return;
  const pd = zlGetPhotoData();
  const id = 'g' + Date.now();
  pd.groups.push({ id, name });
  pd.active = id;
  zlSavePhotoData(pd);
  renderZiliao();
}
function zlDelGroup(gid) {
  const pd = zlGetPhotoData();
  const g = pd.groups.find(x => x.id === gid);
  if (!g) return;
  if (pd.photos.some(p => p.group === gid)) {
    if (!window.confirm('分组「' + g.name + '」内有照片，删除后照片也会一并删除，确定？')) return;
  }
  pd.groups = pd.groups.filter(x => x.id !== gid);
  pd.photos = pd.photos.filter(p => p.group !== gid);
  if (pd.groups.length === 0) pd.groups = [{ id: 'g0', name: '默认分组' }];
  if (!pd.groups.some(x => x.id === pd.active)) pd.active = pd.groups[0].id;
  zlSavePhotoData(pd);
  renderZiliao();
}
function zlMovePhoto(pid, newGid) {
  const pd = zlGetPhotoData();
  const p = pd.photos.find(x => x.id === pid);
  if (!p) return;
  if (pd.groups.some(g => g.id === newGid)) { p.group = newGid; zlSavePhotoData(pd); renderZiliao(); }
}

/* ================================================================
   通用卡片模块工厂
   资料分析(ziliao)、言语理解(yanyu)、判断推理(panduan) 共用同一套交互：
   3 列卡片网格 → 点击卡片进入全页面子视图（知识点编辑器 · 可拍照错题本）
   知识点存 {prefix}_notes，错题照片存 {prefix}_wrong_photos，全部本地存储
   ================================================================ */
function buildCardModule(prefix, cfg) {
  const PAGE = 'page-' + prefix;
  const FN = {
    open:     prefix + '_cOpen',
    back:     prefix + '_cBack',
    add:      prefix + '_cAdd',
    edit:     prefix + '_cEdit',
    del:      prefix + '_cDel',
    photo:    prefix + '_cPhoto',
    delPhoto: prefix + '_cDelPhoto',
    zoom:     prefix + '_cZoom',
  };
  let sub = null;   // null = 卡片网格，否则 = 当前卡片 key
  /* 每张卡片独立的错题照片存储键，避免多错题本互相混 */
  const photoKey = k => prefix + '_wrong_photos_' + k;
  /* 老版本共享照片键迁移到「错题本(wrong)」卡片，仅执行一次 */
  function migratePhotos() {
    if (store.get(prefix + '_wrong_photos', null) !== null) {
      const legacy = store.get(prefix + '_wrong_photos', []);
      if (legacy.length && store.get(photoKey('wrong'), []).length === 0) {
        store.set(photoKey('wrong'), legacy);
      }
      store.remove(prefix + '_wrong_photos');
    }
  }
  /* 错题照片数据（按分组）：{groups:[{id,name}], photos:[{id,data,group}], active} */
  function getPhotoData(key) {
    let d = store.get(photoKey(key), null);
    if (d === null) {
      d = { groups: [{ id: 'g0', name: '默认分组' }], photos: [], active: 'g0' };
    } else if (Array.isArray(d)) {
      // 旧版扁平 dataUrl 数组 → 迁移为分组结构
      d = {
        groups: [{ id: 'g0', name: '默认分组' }],
        photos: d.map((u, i) => ({ id: 'p' + Date.now() + '_' + i, data: u, group: 'g0' })),
        active: 'g0'
      };
    }
    return d;
  }
  function savePhotoData(key, d) { store.set(photoKey(key), d); }

  function notesInit() {
    if (store.get(prefix + '_notes', null) === null) {
      const d = {};
      cfg.cards.forEach(c => { d[c.key] = ((cfg.seed && cfg.seed[c.key]) || []).slice(); });
      store.set(prefix + '_notes', d);
    }
  }
  function getNotes(k) { return (store.get(prefix + '_notes', {})[k] || []); }
  function saveNotes(k, arr) { const a = store.get(prefix + '_notes', {}); a[k] = arr; store.set(prefix + '_notes', a); }
  function addNote(k, t) { const a = getNotes(k); a.push(t.trim()); saveNotes(k, a); }
  function delNote(k, i) { const a = getNotes(k); a.splice(i, 1); saveNotes(k, a); }
  function editNote(k, i, v) { const a = getNotes(k); if (a[i] === undefined) return; a[i] = v; saveNotes(k, a); }
  function addFromInput(k) {
    const inp = document.getElementById(prefix + '-note-input');
    if (!inp) return;
    const v = inp.value.trim();
    if (!v) return;
    addNote(k, v);
    render();
  }

  function renderGrid() {
    let grid = document.getElementById(prefix + '-grid');
    if (!grid) {
      document.getElementById(PAGE).innerHTML =
        '<div class="page-header"><h2>' + cfg.icon + ' ' + cfg.name + '</h2>'
        + '<div class="desc">' + cfg.desc + '</div></div>'
        + '<div class="zl-grid" id="' + prefix + '-grid"></div>';
      grid = document.getElementById(prefix + '-grid');
    }
    grid.innerHTML = cfg.cards.map(c =>
      '<div class="zl-card" data-key="' + c.key + '">'
      + '<div class="zl-card-icon">' + c.icon + '</div>'
      + '<div class="zl-card-name">' + c.name + '</div>'
      + '<div class="zl-card-desc">' + c.desc + '</div>'
      + '<div class="zl-card-stat">📝 ' + getNotes(c.key).length + ' 条知识点</div>'
      + '<div class="zl-card-go">查看 / 编辑 →</div>'
      + '</div>'
    ).join('');
  }

  function renderSub(key) {
    const card = cfg.cards.find(c => c.key === key);
    if (!card) { sub = null; renderGrid(); return; }

    const notes = getNotes(key);
    const listHtml = notes.length
      ? notes.map((t, i) =>
          '<div class="note-item">'
          + '<textarea class="input note-text" data-idx="' + i + '" oninput="' + FN.edit + '(\'' + key + '\',' + i + ',this.value)">' + escHtml(t) + '</textarea>'
          + '<button class="note-del" title="删除" onclick="' + FN.del + '(\'' + key + '\',' + i + ')">✕</button>'
          + '</div>'
        ).join('')
      : '<div class="empty-tip">还没有知识点，在上方输入框添加你的笔记吧 ✍️</div>';

    let photoSection = '';
    if (card.photo) {
      const pd = getPhotoData(key);
      const groupOpts = pd.groups.map(g =>
        '<option value="' + g.id + '"' + (g.id === pd.active ? ' selected' : '') + '>' + escHtml(g.name) + '</option>'
      ).join('');
      const groupsHtml = pd.groups.map(g => {
        const gps = pd.photos.filter(p => p.group === g.id);
        const phtml = gps.length
          ? gps.map(p => {
              const moveOpts = pd.groups.map(gg =>
                '<option value="' + gg.id + '"' + (gg.id === p.group ? ' selected' : '') + '>' + escHtml(gg.name) + '</option>'
              ).join('');
              return '<div class="photo-item">'
                + '<img src="' + p.data + '" alt="错题照片" onclick="' + FN.zoom + '(\'' + key + '\',\'' + p.id + '\')">'
                + '<button class="photo-del" title="删除" onclick="' + FN.delPhoto + '(\'' + key + '\',\'' + g.id + '\',\'' + p.id + '\')">✕</button>'
                + '<select class="photo-move" title="移动到分组" onchange="' + FN.movePhoto + '(\'' + key + '\',\'' + p.id + '\',this.value)">' + moveOpts + '</select>'
                + '</div>';
            }).join('')
          : '<div class="photo-empty">本分组暂无照片</div>';
        return '<div class="photo-group">'
          + '<div class="photo-group-head"><span class="photo-group-name">📂 ' + escHtml(g.name) + '（' + gps.length + '）</span></div>'
          + '<div class="photo-grid">' + phtml + '</div>'
          + '</div>';
      }).join('');
      photoSection =
        '<div class="card zl-detail-photos">'
        + '<div class="section-title">📷 错题照片 · 分组管理</div>'
        + '<div class="photo-toolbar">'
        + '<select class="input photo-group-sel" title="选择当前分组（新拍照片归入此处）" onchange="' + FN.setGroup + '(\'' + key + '\',this.value)">' + groupOpts + '</select>'
        + '<button class="btn" onclick="' + FN.addGroup + '(\'' + key + '\')">＋ 新建分组</button>'
        + '<button class="btn btn-ghost" onclick="' + FN.delGroup + '(\'' + key + '\',\'' + pd.active + '\')">🗑 删除当前分组</button>'
        + '<button class="btn btn-primary" onclick="document.getElementById(\'' + prefix + '-photo-input\').click()">📷 拍摄错题</button>'
        + '<input type="file" id="' + prefix + '-photo-input" accept="image/*" capture="environment" style="display:none" onchange="' + FN.photo + '(this)">'
        + '</div>'
        + '<div class="photo-groups">' + groupsHtml + '</div>'
        + '</div>';
    }

    document.getElementById(PAGE).innerHTML =
      '<div class="page-header zl-sub-head">'
      + '<button class="btn btn-ghost zl-back" onclick="' + FN.back + '()">← 返回</button>'
      + '<div><h2>' + card.icon + ' ' + card.name + '</h2><div class="desc">' + card.desc + '</div></div>'
      + '</div>'
      + '<div class="card">'
      + '<div class="section-title">📝 知识点笔记</div>'
      + '<div class="note-add">'
      + '<input class="input" id="' + prefix + '-note-input" placeholder="输入一条知识点，回车或点添加…" onkeydown="if(event.key===\'Enter\')' + FN.add + '(\'' + key + '\')">'
      + '<button class="btn btn-primary" onclick="' + FN.add + '(\'' + key + '\')">＋ 添加</button>'
      + '</div>'
      + '<div class="note-list">' + listHtml + '</div>'
      + '</div>'
      + photoSection;

    const inp = document.getElementById(prefix + '-note-input');
    if (inp) inp.focus();
  }

  function render() {
    notesInit();
    migratePhotos();
    if (sub) renderSub(sub);
    else renderGrid();
  }

  /* 全局函数（供 inline onclick 调用，名称加前缀避免多模块冲突） */
  window[FN.open] = function (k) { sub = k; render(); };
  window[FN.back] = function () { sub = null; render(); };
  window[FN.add]  = addFromInput;
  window[FN.edit] = editNote;
  window[FN.del]  = function (k, i) { delNote(k, i); render(); };
  window[FN.photo] = function (input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const k = sub;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // 先打开照片编辑器，编辑完成后再写入错题本
        PhotoEditor.open(reader.result, (edited) => {
          const pd = getPhotoData(k);
          pd.photos.push({ id: 'p' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), data: edited, group: pd.active });
          savePhotoData(k, pd);
          render();
        });
        input.value = '';
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  window[FN.delPhoto] = function (key, gid, pid) {
    const pd = getPhotoData(key);
    pd.photos = pd.photos.filter(p => p.id !== pid);
    savePhotoData(key, pd);
    render();
  };
  window[FN.zoom] = function (key, pid) {
    const pd = getPhotoData(key);
    const p = pd.photos.find(x => x.id === pid);
    if (!p) return;
    zlOpenPhotoViewer(p.data);
  };
  window[FN.setGroup] = function (key, gid) {
    const pd = getPhotoData(key);
    if (pd.groups.some(g => g.id === gid)) { pd.active = gid; savePhotoData(key, pd); render(); }
  };
  window[FN.addGroup] = function (key) {
    const name = (window.prompt('请输入新分组名称', '新分组') || '').trim();
    if (!name) return;
    const pd = getPhotoData(key);
    const id = 'g' + Date.now();
    pd.groups.push({ id, name });
    pd.active = id;
    savePhotoData(key, pd);
    render();
  };
  window[FN.delGroup] = function (key, gid) {
    const pd = getPhotoData(key);
    const g = pd.groups.find(x => x.id === gid);
    if (!g) return;
    if (pd.photos.some(p => p.group === gid)) {
      if (!window.confirm('分组「' + g.name + '」内有照片，删除后照片也会一并删除，确定？')) return;
    }
    pd.groups = pd.groups.filter(x => x.id !== gid);
    pd.photos = pd.photos.filter(p => p.group !== gid);
    if (pd.groups.length === 0) pd.groups = [{ id: 'g0', name: '默认分组' }];
    if (!pd.groups.some(x => x.id === pd.active)) pd.active = pd.groups[0].id;
    savePhotoData(key, pd);
    render();
  };
  window[FN.movePhoto] = function (key, pid, newGid) {
    const pd = getPhotoData(key);
    const p = pd.photos.find(x => x.id === pid);
    if (!p) return;
    if (pd.groups.some(g => g.id === newGid)) { p.group = newGid; savePhotoData(key, pd); render(); }
  };

  /* 事件委托：卡片点击进入子页（容器重建后仍有效） */
  document.getElementById(PAGE).addEventListener('click', e => {
    const card = e.target.closest('.zl-card');
    if (!card) return;
    sub = card.dataset.key;
    render();
  });

  return { render, reset: function () { sub = null; render(); } };
}

/* ========== 错题照片编辑器：拍摄后可旋转/翻转/裁剪/调亮，再保存到错题本 ========== */
const PhotoEditor = (function () {
  let mask, stage, imgEl, cropEl, work, img, onSave, state;
  let cropMode = false;
  let drag = null;

  function ensure() {
    if (mask) return;
    // 注入编辑器样式
    const st = document.createElement('style');
    st.textContent =
      '.photo-editor-mask{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:9999;}'
      + '.photo-editor{background:#fff;border-radius:14px;max-width:94vw;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.35);}'
      + '.photo-editor .pe-header{padding:13px 16px;font-weight:700;color:#E0301E;border-bottom:1px solid #f1f1f1;align-self:stretch;}'
      + '.photo-editor .pe-stage{position:relative;background:#161616;display:inline-block;line-height:0;align-self:center;max-width:94vw;overflow:hidden;}'
      + '.photo-editor .pe-img{display:block;max-width:94vw;max-height:60vh;touch-action:none;user-select:none;}'
      + '@media (max-width: 768px) {'
      + '.photo-editor{max-width:100vw;max-height:100vh;border-radius:0;}'
      + '.photo-editor .pe-img{max-width:100vw;max-height:50vh;}'
      + '.photo-editor .pe-stage{max-width:100vw;}'
      + '.photo-editor .pe-actions{justify-content:center;}'
      + '}'
      + '.photo-editor .pe-crop{position:absolute;border:2px solid #E0301E;box-sizing:border-box;cursor:move;background:rgba(224,48,30,.10);touch-action:none;display:none;}'
      + '.photo-editor .pe-crop .pe-handle{position:absolute;width:16px;height:16px;background:#fff;border:2px solid #E0301E;border-radius:50%;}'
      + '.photo-editor .pe-crop .pe-handle.nw{left:-8px;top:-8px;cursor:nwse-resize;}'
      + '.photo-editor .pe-crop .pe-handle.ne{right:-8px;top:-8px;cursor:nesw-resize;}'
      + '.photo-editor .pe-crop .pe-handle.sw{left:-8px;bottom:-8px;cursor:nesw-resize;}'
      + '.photo-editor .pe-crop .pe-handle.se{right:-8px;bottom:-8px;cursor:nwse-resize;}'
      + '.photo-editor .pe-tools{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid #f1f1f1;align-self:stretch;justify-content:center;}'
      + '.photo-editor .pe-tools button{background:#FDF0F4;color:#C0392B;border:1px solid #F5B8C9;border-radius:20px;padding:7px 12px;font-size:13px;cursor:pointer;}'
      + '.photo-editor .pe-tools button:active{background:#F5B8C9;}'
      + '.photo-editor .pe-actions{display:flex;gap:10px;padding:10px 12px;border-top:1px solid #f1f1f1;align-self:stretch;justify-content:flex-end;}'
      + '.photo-editor .pe-actions button{border-radius:9px;padding:9px 18px;font-size:14px;cursor:pointer;border:none;}'
      + '.photo-editor .pe-cancel{background:#fff;color:#666;border:1px solid #ddd !important;}'
      + '.photo-editor .pe-save{background:#E0301E;color:#fff;font-weight:700;}';
    document.head.appendChild(st);

    mask = document.createElement('div');
    mask.className = 'photo-editor-mask';
    mask.innerHTML =
      '<div class="photo-editor">'
      + '<div class="pe-header">📷 编辑错题照片（旋转 / 翻转 / 裁剪 / 调亮后保存）</div>'
      + '<div class="pe-stage" id="pe-stage"><img id="pe-img" alt=""><div class="pe-crop" id="pe-crop">'
      + '<span class="pe-handle nw" data-h="nw"></span><span class="pe-handle ne" data-h="ne"></span>'
      + '<span class="pe-handle sw" data-h="sw"></span><span class="pe-handle se" data-h="se"></span></div></div>'
      + '<div class="pe-tools">'
      + '<button type="button" data-act="rotL">↺ 左转</button>'
      + '<button type="button" data-act="rotR">↻ 右转</button>'
      + '<button type="button" data-act="flipH">⇋ 水平翻转</button>'
      + '<button type="button" data-act="flipV">⇅ 垂直翻转</button>'
      + '<button type="button" data-act="bri+">☀ 变亮</button>'
      + '<button type="button" data-act="bri-">🌙 变暗</button>'
      + '<button type="button" data-act="crop">✂ 裁剪</button>'
      + '<button type="button" data-act="reset">↺ 重置</button>'
      + '</div>'
      + '<div class="pe-actions"><button type="button" class="pe-cancel" data-act="cancel">取消</button>'
      + '<button type="button" class="pe-save" data-act="save">保存并加入错题本</button></div>'
      + '</div>';
    document.body.appendChild(mask);
    stage = mask.querySelector('#pe-stage');
    imgEl = mask.querySelector('#pe-img');
    cropEl = mask.querySelector('#pe-crop');
    work = document.createElement('canvas');

    mask.querySelector('.pe-tools').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      doAction(b.dataset.act);
    });
    mask.querySelector('.pe-actions').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'cancel') close();
      else if (b.dataset.act === 'save') save();
    });
    cropEl.addEventListener('pointerdown', onCropDown);
    window.addEventListener('pointermove', onCropMove);
    window.addEventListener('pointerup', onCropUp);
    mask.addEventListener('pointerdown', e => { if (e.target === mask) close(); });
  }

  function setCropFull() {
    cropEl.style.left = '0px'; cropEl.style.top = '0px';
    cropEl.style.width = stage.clientWidth + 'px';
    cropEl.style.height = stage.clientHeight + 'px';
  }
  function clampCrop() {
    let x = parseFloat(cropEl.style.left) || 0;
    let y = parseFloat(cropEl.style.top) || 0;
    let w = parseFloat(cropEl.style.width) || stage.clientWidth;
    let h = parseFloat(cropEl.style.height) || stage.clientHeight;
    const min = 20;
    if (w < min) w = min; if (h < min) h = min;
    if (x < 0) x = 0; if (y < 0) y = 0;
    if (x + w > stage.clientWidth) { w = stage.clientWidth - x; }
    if (y + h > stage.clientHeight) { h = stage.clientHeight - y; }
    if (w < min) w = min; if (h < min) h = min;
    cropEl.style.left = x + 'px'; cropEl.style.top = y + 'px';
    cropEl.style.width = w + 'px'; cropEl.style.height = h + 'px';
  }

  function rebuild() {
    const rot = ((state.rot % 360) + 360) % 360;
    let sw = img.width, sh = img.height;
    if (rot === 90 || rot === 270) { sw = img.height; sh = img.width; }
    work.width = sw; work.height = sh;
    const ctx = work.getContext('2d');
    ctx.clearRect(0, 0, sw, sh);
    ctx.save();
    ctx.translate(sw / 2, sh / 2);
    ctx.rotate(rot * Math.PI / 180);
    ctx.scale(state.flipH ? -1 : 1, state.flipV ? -1 : 1);
    ctx.filter = 'brightness(' + state.bri + '%) contrast(' + state.con + '%)';
    ctx.drawImage(img, -img.width / 2, -img.height / 2, img.width, img.height);
    ctx.restore();
    ctx.filter = 'none';
    imgEl.src = work.toDataURL('image/jpeg', 0.92);
    if (cropMode) clampCrop();
  }

  function cropAfterTransform() { if (cropMode) setCropFull(); }
  function doAction(a) {
    if (a === 'rotL') { state.rot -= 90; cropAfterTransform(); }
    else if (a === 'rotR') { state.rot += 90; cropAfterTransform(); }
    else if (a === 'flipH') { state.flipH = !state.flipH; cropAfterTransform(); }
    else if (a === 'flipV') { state.flipV = !state.flipV; cropAfterTransform(); }
    else if (a === 'bri+') state.bri = Math.min(200, state.bri + 15);
    else if (a === 'bri-') state.bri = Math.max(40, state.bri - 15);
    else if (a === 'reset') { state = { rot: 0, flipH: false, flipV: false, bri: 100, con: 100 }; cropMode = false; cropEl.style.display = 'none'; }
    else if (a === 'crop') {
      cropMode = !cropMode;
      cropEl.style.display = cropMode ? 'block' : 'none';
      if (cropMode) setCropFull();
    }
    rebuild();
  }

  function onCropDown(e) {
    if (!cropMode) return;
    e.preventDefault();
    const h = e.target.dataset.h;
    drag = { mode: h || 'move', sx: e.clientX, sy: e.clientY, o: {
      left: parseFloat(cropEl.style.left) || 0, top: parseFloat(cropEl.style.top) || 0,
      width: parseFloat(cropEl.style.width) || 0, height: parseFloat(cropEl.style.height) || 0 } };
  }
  function onCropMove(e) {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    const o = drag.o; let { left, top, width, height } = o; const min = 20;
    if (drag.mode === 'move') {
      left += dx; top += dy;
      if (left < 0) left = 0; if (top < 0) top = 0;
      if (left + width > stage.clientWidth) left = stage.clientWidth - width;
      if (top + height > stage.clientHeight) top = stage.clientHeight - height;
    } else {
      if (drag.mode === 'se') { width = o.width + dx; height = o.height + dy; }
      else if (drag.mode === 'nw') { left = o.left + dx; top = o.top + dy; width = o.width - dx; height = o.height - dy; }
      else if (drag.mode === 'ne') { top = o.top + dy; width = o.width + dx; height = o.height - dy; }
      else if (drag.mode === 'sw') { left = o.left + dx; width = o.width - dx; height = o.height + dy; }
      if (width < min) { if (drag.mode === 'nw' || drag.mode === 'sw') left = o.left + o.width - min; width = min; }
      if (height < min) { if (drag.mode === 'nw' || drag.mode === 'ne') top = o.top + o.height - min; height = min; }
      if (left < 0) { width += left; left = 0; }
      if (top < 0) { height += top; top = 0; }
      if (left + width > stage.clientWidth) width = stage.clientWidth - left;
      if (top + height > stage.clientHeight) height = stage.clientHeight - top;
    }
    cropEl.style.left = left + 'px'; cropEl.style.top = top + 'px';
    cropEl.style.width = width + 'px'; cropEl.style.height = height + 'px';
  }
  function onCropUp() { drag = null; }

  function save() {
    const sx = work.width / stage.clientWidth;
    let cx, cy, cw, ch;
    if (cropMode) {
      cx = parseFloat(cropEl.style.left) * sx; cy = parseFloat(cropEl.style.top) * sx;
      cw = parseFloat(cropEl.style.width) * sx; ch = parseFloat(cropEl.style.height) * sx;
    } else { cx = 0; cy = 0; cw = work.width; ch = work.height; }
    if (cw < 2 || ch < 2) { cx = 0; cy = 0; cw = work.width; ch = work.height; }
    const maxW = 1400; let ow = cw, oh = ch;
    if (ow > maxW) { oh = Math.round(oh * maxW / ow); ow = maxW; }
    const out = document.createElement('canvas'); out.width = ow; out.height = oh;
    out.getContext('2d').drawImage(work, cx, cy, cw, ch, 0, 0, ow, oh);
    const data = out.toDataURL('image/jpeg', 0.85);
    const cb = onSave; close(); if (cb) cb(data);
  }
  function close() { if (mask) mask.style.display = 'none'; onSave = null; }
  function open(src, cb) {
    ensure();
    const im = new Image();
    im.onload = () => {
      let data = src;
      if (im.width > 1600) {
        const c = document.createElement('canvas');
        c.width = 1600; c.height = Math.round(im.height * 1600 / im.width);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        data = c.toDataURL('image/jpeg', 0.92);
      }
      const im2 = new Image();
      im2.onload = () => {
        img = im2; onSave = cb;
        state = { rot: 0, flipH: false, flipV: false, bri: 100, con: 100 };
        cropMode = false; cropEl.style.display = 'none';
        rebuild();
        mask.style.display = 'flex';
        // 等预览图渲染出真实尺寸后再把裁剪框铺满
        imgEl.onload = function () { setCropFull(); imgEl.onload = null; };
      };
      im2.src = data;
    };
    im.src = src;
  }
  return { open: open };
})();
